<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner de Rede</title>
<style>
/* ============ Tokens: console claro (padrão) ============ */
:root {
  --bar: #243040; --bar-t: #E6EBF1; --bar-m: #9FB0C3; --bar-h: rgba(255,255,255,.09);
  --chrome: #E2E5E9; --side: #F2F3F5; --side-h: #E1E5EA; --side-sel: #2F6FD6; --side-sel-t: #FFFFFF;
  --win: #FFFFFF; --win-t: #EEF0F3; --tool: #F7F8FA; --head: #F6F7F9;
  --border: #C5CBD3; --border-2: #E2E5E9;
  --text: #1B2430; --text-2: #4B5563; --text-3: #6B7685;
  --accent: #2F6FD6; --accent-2: #2558B0; --accent-soft: #E6EEFB; --accent-ink: #1F56B3;
  --sel: #CFE0FA; --hover: #EEF3FB;
  --ok: #1E8A4C; --ok-soft: #E4F3EA; --warn: #A86400; --warn-soft: #FDF2DF; --crit: #C42B2B; --crit-soft: #FBE8E8;
  --btn-1: #FFFFFF; --btn-2: #ECEEF2; --btn-b: #B6BDC7; --field: #FFFFFF; --field-ro: #F3F4F6;
  --shadow: 0 10px 30px rgba(16,24,40,.20), 0 2px 6px rgba(16,24,40,.08);
  --scrim: rgba(15,20,28,.38);
  --c-roteador: #0D9488; --c-camera: #7C3AED; --c-acesso: #EA580C; --c-impressora: #CA8A04; --c-servidor: #16A34A;
  --c-computador: #2563EB; --c-celular: #DB2777; --c-tv: #0891B2; --c-iot: #65A30D; --c-voip: #C026D3; --c-desconhecido: #98A2B3;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bar: #11161C; --bar-t: #E3E8EE; --bar-m: #8C99A8; --bar-h: rgba(255,255,255,.07);
  --chrome: #171B21; --side: #1D232B; --side-h: #262E38; --side-sel: #3A78DE; --side-sel-t: #FFFFFF;
  --win: #20262E; --win-t: #262D36; --tool: #232A33; --head: #29303A;
  --border: #3A4350; --border-2: #2E3641;
  --text: #E3E8EE; --text-2: #AEB7C3; --text-3: #85909D;
  --accent: #4C8DF6; --accent-2: #6EA2F8; --accent-soft: rgba(76,141,246,.15); --accent-ink: #8CB6FA;
  --sel: #24406B; --hover: #27313D;
  --ok: #4CC38A; --ok-soft: rgba(76,195,138,.14); --warn: #E3B341; --warn-soft: rgba(227,179,65,.14); --crit: #F07070; --crit-soft: rgba(240,112,112,.14);
  --btn-1: #2E3641; --btn-2: #262D36; --btn-b: #46505E; --field: #1A1F26; --field-ro: #242A32;
  --shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --scrim: rgba(0,0,0,.5);
  --c-roteador: #2DD4BF; --c-camera: #A78BFA; --c-acesso: #FB923C; --c-impressora: #FACC15; --c-servidor: #4ADE80;
  --c-computador: #60A5FA; --c-celular: #F472B6; --c-tv: #22D3EE; --c-iot: #A3E635; --c-voip: #E879F9; --c-desconhecido: #8A94A3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--chrome); color: var(--text); font: 400 13px/1.45 "Segoe UI", Tahoma, system-ui, -apple-system, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.ico { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.mono { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; font-size: 12px; }
.muted { color: var(--text-3); }
.grow { flex: 1; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--border); border: 3px solid transparent; background-clip: padding-box; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ Moldura: barra superior, menu, barra de status ============ */
.top { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: var(--bar); color: var(--bar-t); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; z-index: 30; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; width: 176px; flex: none; }
.brand b { font-weight: 600; font-size: 13.5px; }
.brand small { color: var(--bar-m); font-size: 11.5px; }
.ctx { color: var(--bar-m); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.ctx b { color: var(--bar-t); font-weight: 600; }
.find { display: flex; align-items: center; gap: 6px; height: 26px; width: 290px; flex: none; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 3px; padding: 0 4px 0 7px; }
.find:focus-within { border-color: var(--accent-2); background: rgba(255,255,255,.12); }
.find input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; width: 100%; color: var(--bar-t); font-size: 12.5px; }
.find { min-width: 0; }
.find input::placeholder { color: var(--bar-m); }
.find kbd { font: 10.5px Consolas, monospace; color: var(--bar-m); border: 1px solid rgba(255,255,255,.2); border-radius: 3px; padding: 0 4px; }
.tb { height: 28px; min-width: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; border-radius: 3px; border: 1px solid transparent; background: transparent; color: var(--bar-t); cursor: pointer; font-size: 12.5px; text-decoration: none; white-space: nowrap; flex: none; }
.tb:hover { background: var(--bar-h); border-color: rgba(255,255,255,.14); }
.tb.menu { display: none; }
.side { position: fixed; top: 40px; bottom: 24px; left: 0; width: 192px; background: var(--side); border-right: 1px solid var(--border); overflow-y: auto; padding: 6px 0; z-index: 25; }
.side .grp { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 10px 14px 3px; letter-spacing: .03em; }
.mi { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 12px 0 14px; border: 0; background: none; cursor: pointer; color: var(--text); font-size: 13px; text-align: left; }
.mi:hover { background: var(--side-h); }
.mi.on { background: var(--side-sel); color: var(--side-sel-t); }
.mi .ico { color: var(--text-2); }
.mi.on .ico { color: inherit; }
.mi .bdg { margin-left: auto; min-width: 18px; height: 16px; border-radius: 8px; background: var(--crit); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.side-ft { margin: 12px 10px 4px; padding: 8px 6px 0; border-top: 1px solid var(--border-2); font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.side-ft b { color: var(--text-2); font-weight: 600; }
.main { margin-left: 192px; padding: 50px 10px 36px; min-width: 0; }
.stb { position: fixed; left: 0; right: 0; bottom: 0; height: 24px; background: var(--win-t); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 12px; color: var(--text-2); z-index: 30; white-space: nowrap; overflow: hidden; }
.stb .ico { width: 14px; height: 14px; }
.stb .pb { width: 140px; height: 9px; border: 1px solid var(--border); background: var(--win); border-radius: 2px; overflow: hidden; flex: none; }
.stb .pb i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.stb .sx { border-left: 1px solid var(--border); padding-left: 10px; }
.stb button { height: 18px; font-size: 11.5px; padding: 0 8px; }
.scrim { position: fixed; inset: 40px 0 0 0; background: var(--scrim); z-index: 24; display: none; }
body.menu-open .scrim { display: block; }

/* ============ Janelas ============ */
.win { background: var(--win); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 1px 2px rgba(16,24,40,.06); display: flex; flex-direction: column; min-width: 0; margin-bottom: 10px; }
.win-t { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 8px 0 10px; background: var(--win-t); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12.5px; border-radius: 4px 4px 0 0; }
.win-t > .ico { color: var(--accent); }
.win-c { color: var(--text-3); font-weight: 400; }
.win-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--win-t); padding: 4px 6px 0; overflow-x: auto; scrollbar-width: thin; flex: none; }
.tab { height: 26px; padding: 0 11px; border: 1px solid transparent; border-bottom: 0; border-radius: 3px 3px 0 0; background: transparent; cursor: pointer; font-size: 12.5px; color: var(--text-2); white-space: nowrap; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.tab:hover { color: var(--text); background: var(--side-h); }
.tab.on { background: var(--win); border-color: var(--border); color: var(--text); font-weight: 600; }
.tab .n { color: var(--text-3); font-weight: 400; }
.win-tool { display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-bottom: 1px solid var(--border-2); background: var(--tool); flex-wrap: wrap; flex: none; }
.win-tool .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.win-b { overflow: auto; min-height: 0; }
.win-b.pad { padding: 12px; }
.win-b.tbl { max-height: calc(100vh - 210px); }
.win-st { min-height: 24px; display: flex; align-items: center; gap: 12px; padding: 0 10px; border-top: 1px solid var(--border-2); background: var(--tool); font-size: 12px; color: var(--text-2); flex-wrap: wrap; border-radius: 0 0 4px 4px; }
.win-st .leg { margin-left: auto; color: var(--text-3); font-family: Consolas, monospace; font-size: 11.5px; }

/* botões */
.b { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--btn-b); border-radius: 3px; background: linear-gradient(var(--btn-1), var(--btn-2)); color: var(--text); cursor: pointer; font-size: 12.5px; white-space: nowrap; text-decoration: none; flex: none; }
.b:hover { border-color: var(--accent); }
.b:active { background: var(--btn-2); }
.b.pri { background: var(--accent); border-color: var(--accent-2); color: #fff; }
.b.pri:hover { background: var(--accent-2); }
.b.dng .ico { color: var(--crit); }
.b.icon { padding: 0 5px; }
.b.on { background: var(--sel); border-color: var(--accent); }
.b:disabled { opacity: .5; cursor: default; border-color: var(--btn-b); }
.seg { display: inline-flex; flex: 0 1 auto; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg .b { border-radius: 0; margin-left: -1px; }
.seg .b:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.seg .b:last-child { border-radius: 0 3px 3px 0; }
.seg .b.on { position: relative; z-index: 1; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; cursor: pointer; padding: 0 4px; user-select: none; white-space: nowrap; }
.chk input { margin: 0; accent-color: var(--accent); }

/* tabelas */
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.t th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 600; color: var(--text-2); background: linear-gradient(var(--head), var(--win-t)); height: 26px; padding: 0 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border-2); white-space: nowrap; user-select: none; }
.t th[data-sort] { cursor: pointer; }
.t th[data-sort]:hover { color: var(--text); }
.t th .ico { width: 12px; height: 12px; vertical-align: -2px; margin-left: 2px; }
.t td { height: 26px; padding: 2px 8px; border-bottom: 1px solid var(--border-2); border-right: 1px solid var(--border-2); white-space: nowrap; vertical-align: middle; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.t th:last-child, .t td:last-child { border-right: 0; }
.t tbody tr:hover td { background: var(--hover); }
.t tbody tr.sel td { background: var(--sel); }
.t tr.off td { color: var(--text-3); }
.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t td.wrap { white-space: normal; }
.t .fl { font: 600 11.5px Consolas, monospace; letter-spacing: 1px; width: 46px; color: var(--text-3); }
.fl .n { color: var(--accent); } .fl .u { color: var(--warn); } .fl .e { color: var(--text-2); } .fl .g { color: var(--ok); }
.t .grp td { background: var(--win-t); font-weight: 600; color: var(--text-2); height: 24px; }
.t .grp td .ico { color: var(--accent); margin-right: 4px; }
.t.kv td:first-child { color: var(--text-2); width: 42%; }
.t.kv td { border-right: 0; }
.t.kv tbody tr:hover td { background: none; }
.t tr[data-gocat], .t tr[data-q], .t tr[data-k] { cursor: pointer; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 0; flex: none; }
.pc { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border: 1px solid var(--border); border-radius: 3px; font: 11.5px Consolas, monospace; color: var(--text-2); background: var(--field-ro); margin-right: 3px; text-decoration: none; vertical-align: middle; }
a.pc:hover, button.pc:hover { border-color: var(--accent); color: var(--accent-ink); cursor: pointer; }
.lnk { color: var(--accent-ink); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }
.lnk:hover { text-decoration: underline; }
.ib { width: 22px; height: 20px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 3px; background: none; color: var(--text-2); cursor: pointer; text-decoration: none; vertical-align: middle; padding: 0; }
.ib:hover { border-color: var(--border); background: var(--win); color: var(--accent-ink); }
.ib .ico { width: 14px; height: 14px; }
.mb { display: inline-block; height: 8px; background: var(--c, var(--accent)); border-radius: 1px; vertical-align: 0; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 0 5px; border-radius: 2px; background: var(--field-ro); color: var(--text-2); border: 1px solid var(--border); line-height: 15px; vertical-align: 1px; margin-left: 4px; }
.tag.new { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.tag.w { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.conf { display: inline-flex; align-items: center; gap: 5px; }
.conf i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.conf.alta i { background: var(--ok); } .conf.média i { background: var(--warn); } .conf.baixa i { background: var(--crit); }
.empty { text-align: center; padding: 48px 16px; color: var(--text-3); }
.empty .ico { width: 36px; height: 36px; color: var(--text-3); }
.empty h3 { color: var(--text); margin: 10px 0 4px; font-size: 15px; font-weight: 600; }

/* formulários (estilo diálogo) */
.fr { display: grid; grid-template-columns: 130px minmax(0, 1fr); align-items: center; gap: 4px 8px; margin-bottom: 6px; }
.fr > label { text-align: right; color: var(--text-2); font-size: 12.5px; }
.fr .hint { grid-column: 2; font-size: 11.5px; color: var(--text-3); margin-top: -2px; }
.fr input:not([type=checkbox]):not([type=range]), .fr select, .fr textarea { height: 24px; border: 1px solid var(--btn-b); border-radius: 2px; background: var(--field); padding: 0 6px; font-size: 12.5px; outline: none; width: 100%; min-width: 0; }
.fr textarea { height: 72px; padding: 4px 6px; resize: vertical; }
.fr input[readonly], .fr textarea[readonly] { background: var(--field-ro); color: var(--text-2); }
.fr input:focus, .fr select:focus, .fr textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.fr input[type=range] { accent-color: var(--accent); width: 100%; }
.fr .two { display: flex; gap: 6px; align-items: center; }
.note { font-size: 12px; padding: 6px 9px; border-radius: 3px; border: 1px solid var(--border); background: var(--field-ro); color: var(--text-2); }
.note.w { border-color: transparent; background: var(--warn-soft); color: var(--text); border-left: 3px solid var(--warn); }

/* diálogo (janela de item) */
.dlg { border: 1px solid var(--border); border-radius: 4px; padding: 0; background: var(--win); color: var(--text); box-shadow: var(--shadow); width: min(680px, calc(100vw - 20px)); max-height: calc(100vh - 30px); }
.dlg.sm { width: min(540px, calc(100vw - 20px)); }
.dlg::backdrop { background: var(--scrim); }
.wd { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.wd-t { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 10px; background: var(--bar); color: var(--bar-t); font-weight: 600; font-size: 12.5px; flex: none; }
.wd-t .x { margin-left: auto; height: 24px; }
.wd-body { display: flex; gap: 10px; padding: 10px; min-height: 0; overflow: auto; }
.wd-main { flex: 1; min-width: 0; }
.wd-main .win-tabs { padding: 0; background: none; }
.pane { border: 1px solid var(--border); border-top: 0; padding: 12px 10px 6px; background: var(--win); min-height: 250px; }
.wd-btns { display: flex; flex-direction: column; gap: 5px; width: 122px; flex: none; }
.wd-btns .b { justify-content: flex-start; width: 100%; }
.wd-btns hr { border: 0; border-top: 1px solid var(--border-2); margin: 3px 0; }
.wd-st { min-height: 24px; border-top: 1px solid var(--border-2); background: var(--tool); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; color: var(--text-2); flex: none; flex-wrap: wrap; }
.evid { margin: 0; padding: 0 0 0 4px; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.evid li { display: flex; gap: 6px; align-items: flex-start; }
.evid li .ico { color: var(--accent); width: 14px; height: 14px; margin-top: 2px; }

/* painel */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; align-items: start; }
.dash > .win { margin: 0; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c12 { grid-column: span 12; }
.kpi { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .l { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .l .ico { color: var(--text-3); width: 14px; height: 14px; }
.kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .s { font-size: 11.5px; color: var(--text-3); }
.hl { display: flex; align-items: center; gap: 8px; }
.st-ok { color: var(--ok); } .st-warn { color: var(--warn); } .st-crit { color: var(--crit); }
.sev-n { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.sev-n i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* mapa */
.mapwin .win-b { position: relative; height: calc(100vh - 168px); min-height: 420px; background-color: var(--win);
  background-image: linear-gradient(var(--border-2) 1px, transparent 1px), linear-gradient(90deg, var(--border-2) 1px, transparent 1px); background-size: 24px 24px; }
#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.drag { cursor: grabbing; }
#map .edge-g { stroke-width: 2; stroke-opacity: .6; fill: none; }
#map .edge { stroke-width: 1; stroke-opacity: .35; }
#map .node { cursor: pointer; }
#map .node .nb { fill: var(--win); stroke-width: 2; }
#map .node:hover .nb { stroke-width: 3; fill: var(--hover); }
#map .node.sel .nb { stroke-width: 3.5; fill: var(--sel); }
#map .node.off .nb { stroke-dasharray: 3 3; }
#map .node.off { opacity: .55; }
#map .lbl { font-size: 10.5px; fill: var(--text-2); text-anchor: middle; paint-order: stroke; stroke: var(--win); stroke-width: 3px; }
#map .hub-lbl { font-size: 12px; fill: var(--text); font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: var(--win); stroke-width: 4px; }
#map .hub-cnt { font-size: 10.5px; fill: var(--text-3); text-anchor: middle; paint-order: stroke; stroke: var(--win); stroke-width: 3px; }
#map .dim { opacity: .12; }
.map-tools { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.map-tools .b { width: 30px; height: 30px; justify-content: center; padding: 0; background: var(--win); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.map-hint { position: absolute; left: 10px; bottom: 10px; font-size: 11.5px; color: var(--text-3); background: var(--win); border: 1px solid var(--border-2); padding: 2px 8px; border-radius: 3px; }

/* varredura */
.steps { display: flex; margin: 2px 0 10px; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-3); position: relative; text-align: center; }
.step::before { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--border-2); z-index: 0; }
.step:first-child::before { display: none; }
.step .sd { width: 24px; height: 24px; border-radius: 50%; background: var(--field-ro); border: 1px solid var(--border); display: grid; place-items: center; z-index: 1; }
.step .sd .ico { width: 13px; height: 13px; }
.step.done .sd { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.step.done::before, .step.cur::before { background: var(--accent); }
.step.cur .sd { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
.step.cur { color: var(--text); font-weight: 600; }
.pbar { height: 12px; border: 1px solid var(--border); background: var(--field-ro); border-radius: 2px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.nums div { border: 1px solid var(--border-2); border-radius: 3px; padding: 6px 9px; background: var(--tool); }
.nums b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.nums span { font-size: 11.5px; color: var(--text-3); }
.logt td:first-child { width: 72px; color: var(--text-3); }
.logt td { font-family: Consolas, monospace; font-size: 12px; height: 22px; }
.logbox { height: 240px; overflow: auto; }

/* ============ Relatório de diagnóstico ============ */
.rp { max-width: 1120px; margin: 0 auto; padding: 18px 20px 12px; }
.rp-head .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.rp-head h2 { font-size: 22px; margin: 3px 0 8px; font-weight: 600; letter-spacing: -.01em; }
.rp-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--text-2); font-size: 12.5px; }
.rp-meta span { display: inline-flex; gap: 6px; align-items: center; }
.rp-meta .ico { color: var(--text-3); width: 14px; height: 14px; }
.rp-sum { margin-top: 14px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 11px 14px; border-radius: 3px; font-size: 14px; line-height: 1.6; }
.rp-sum .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 4px; }
.rp-sum p { margin: 0 0 4px; } .rp-sum p:last-child { margin: 0; }
.rp-sum strong { color: var(--accent-ink); font-weight: 600; }
.rp-h { font-size: 14px; font-weight: 600; margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); display: flex; gap: 7px; align-items: center; }
.rp-h .ico { color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; background: var(--win); min-width: 0; }
.tile.ok { --st: var(--ok); } .tile.warn { --st: var(--warn); } .tile.crit { --st: var(--crit); }
.tile .tl { display: flex; align-items: center; gap: 2px 6px; font-size: 11.5px; color: var(--text-2); font-weight: 600; flex-wrap: wrap; }
.tile .tlx { display: inline-flex; align-items: center; gap: 6px; }
.tile .tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--st, var(--border)); }
.tile .tst { margin-left: auto; font-size: 11px; color: var(--st); }
.tile .tn { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; line-height: 1.25; }
.tile .ts { font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }
.g-ch2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; align-items: start; }
.chb { border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; background: var(--win); min-width: 0; }
.chb .cht { font-weight: 600; font-size: 12.5px; margin-bottom: 8px; }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-variant-numeric: tabular-nums; }
.ch-cap { font-size: 11.5px; color: var(--text-3); margin: 6px 0 0; }
.ch-lbl { font-size: 12px; font-weight: 600; fill: var(--text); }
.ch-lbl2 { font-weight: 600; fill: var(--text); }
.ch-ax { font-size: 11px; fill: var(--text-3); }
.ch-val { font-size: 12px; font-weight: 600; fill: var(--text); }
.ch-grid { stroke: var(--border-2); stroke-width: 1; }
.ch-track { fill: var(--field-ro); stroke: var(--border-2); }
.ch-whisk line { stroke: var(--text); stroke-width: 1.5; }
.ch-plan { stroke: var(--text); stroke-width: 2.5; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.ch-area { fill: var(--accent); opacity: .14; }
.ch-lost { stroke: var(--crit); stroke-width: 2.5; }
.ch-hit { fill: transparent; }
.ch-row[data-gocat], .ch-row[data-ports] { cursor: pointer; }
.ch-row[data-gocat]:hover .ch-hit, .ch-row[data-ports]:hover .ch-hit { fill: var(--hover); }
.ipc { display: inline-flex; height: 19px; padding: 0 6px; border-radius: 3px; background: var(--field-ro); border: 1px solid var(--border-2); font-size: 11.5px; align-items: center; margin: 0 4px 4px 0; }
.ipcs { display: flex; flex-wrap: wrap; margin-top: 6px; }
.ach { border: 1px solid var(--border); border-left: 3px solid var(--sev); border-radius: 3px; padding: 9px 12px; background: var(--win); margin-bottom: 8px; }
.ach.crit { --sev: var(--crit); --sev-s: var(--crit-soft); } .ach.warn { --sev: var(--warn); --sev-s: var(--warn-soft); }
.ach.info { --sev: var(--accent); --sev-s: var(--accent-soft); } .ach.ok { --sev: var(--ok); --sev-s: var(--ok-soft); }
.ach-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ach h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.ach p { margin: 6px 0 0; }
.ach .acao { font-size: 12.5px; color: var(--text-2); }
.ach .acao b { font-size: 11px; letter-spacing: .06em; color: var(--text); }
.sevc { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 2px; background: var(--sev-s); color: var(--sev); }
.plano { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.plano li { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--border); border-radius: 3px; padding: 8px 12px; background: var(--win); }
.plano .num { width: 24px; height: 24px; border-radius: 3px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 12px; font-variant-numeric: tabular-nums; }
.plano p { margin: 2px 0 0; color: var(--text-2); }
.pend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pend li { display: flex; gap: 8px; align-items: flex-start; }
.pend li .ico { color: var(--warn); margin-top: 1px; }
.rp-ft { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 26px; font-size: 11.5px; color: var(--text-3); }

/* ============ Telas menores ============ */
@media (max-width: 1100px) { .c3 { grid-column: span 6; } .c4, .c5, .c6, .c7 { grid-column: span 12; } .ctx { display: none; } .find { flex: 1; width: auto; } }
@media (max-width: 860px) {
  .tb.menu { display: inline-flex; }
  .brand { width: auto; }
  .side { transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open .side { transform: none; }
  .main { margin-left: 0; }
  .g-ch2 { grid-template-columns: 1fr; }
  .tb .lb { display: none; }
}
@media (max-width: 600px) {
  .c3 { grid-column: span 12; }
  .brand small, .find kbd, .brand b { display: none; }
  .fr { grid-template-columns: 1fr; } .fr > label { text-align: left; } .fr .hint { grid-column: 1; }
  .wd-body { flex-direction: column; } .wd-btns { flex-direction: row; flex-wrap: wrap; width: auto; } .wd-btns .b { width: auto; } .wd-btns hr { display: none; }
  .tiles { grid-template-columns: 1fr 1fr; } .tile .tn { font-size: 17px; }
  .hide-sm { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ============ Impressão (A4, sempre claro) ============ */
@page { size: A4; margin: 12mm; }
@media print {
  :root, :root[data-theme="dark"] {
    --win: #FFFFFF; --win-t: #F1F3F5; --tool: #F7F8FA; --head: #F6F7F9; --chrome: #FFFFFF;

    --c-roteador: #0D9488; --c-camera: #7C3AED; --c-acesso: #EA580C; --c-impressora: #CA8A04; --c-servidor: #16A34A;
    --c-computador: #2563EB; --c-celular: #DB2777; --c-tv: #0891B2; --c-iot: #65A30D; --c-voip: #C026D3; --c-desconhecido: #98A2B3;
    color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; }
  .top, .side, .stb, .scrim, .dlg, .no-print { display: none !important; }
  .main { margin: 0; padding: 0; }
  .win { border: 0; box-shadow: none; margin: 0; }
  .win > .win-t, .win > .win-tool, .win > .win-st { display: none; }
  .win-b { overflow: visible; max-height: none !important; }
  .rp { padding: 0; max-width: none; }
  .tile, .ach, .chb, .plano li, .rp-sum, .t tr, .pend li { break-inside: avoid; }
  .rp-h { break-after: avoid; margin-top: 16px; }
  .g-ch2 { grid-template-columns: 1fr 1fr; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tile .tn { font-size: 17px; }
}
</style>
</head>

function saudeWin(cls) {
  const R = D.diagnostico, cfg = D.config || {};

  const g = R.gateway || {}, v = R.velocidade || {}, inet = (R.internet || []).filter(x => x && x.enviados);
  const dn = median(v.download_mbps), pd = cfg.plano_down_mbps;
  const dns = (R.dns || []).find(x => x && x.consultas);
  const stt = s => s ? `<span class="st-${s}">${{ ok: 'OK', warn: 'Atenção', crit: 'Crítico' }[s]}</span>` : '<span class="muted">—</span>';
  const im = inet.length ? inet.reduce((s, x) => s + (x.media_ms || 0), 0) / inet.length : null;
  const rows = [
    ['Roteador', g.enviados ? `${nf(g.perda_pct)}% perda · ${nf(g.media_ms, 2)} ms` : 'não medido', g.enviados ? (ids.has('R-01') ? 'crit' : 'ok') : ''],
    ['Internet', im != null ? `${nf(im)} ms` : 'não medido', im != null ? (im > 80 ? 'warn' : 'ok') : ''],
    ['Download livre', dn != null ? `${nf(dn)} Mbps${pd ? ' de ' + nf(pd, 0) : ''}` : (v.pulado ? 'teste desligado' : 'não medido'), dn != null && pd ? (dn / pd >= .8 ? 'ok' : dn / pd >= .6 ? 'warn' : 'crit') : ''],

    ['MTU', R.mtu && R.mtu.caminho ? R.mtu.caminho + ' bytes' : 'não medido', R.mtu && R.mtu.caminho ? (ids.has('R-13') ? 'warn' : 'ok') : ''],
  ].map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${stt(c)}</td></tr>`).join('');

function drawMap(devs) {
  const vp = $('#vp');
  const gw = devs.find(d => d.tag === 'gateway');
  const others = devs.filter(d => d !== gw);
  const groups = D.devCats.map(c => ({ c, items: others.filter(d => d.cat === c.id).sort((a, b) => ipNum(a.ip) - ipNum(b.ip)) })).filter(g => g.items.length);
  const SP = 46;
  groups.forEach(g => {
    const rings = []; let left = g.items.length, k = 1;
    while (left > 0) { const r = 30 + k * 48; const cap = Math.max(6, Math.floor(2 * Math.PI * r / SP)); const n = Math.min(cap, left); rings.push({ r, n }); left -= n; k++; }
    // rl = anel externo; o rótulo do dispositivo de baixo vai até rl+32, então o título do grupo fica abaixo disso
    g.rings = rings; g.rl = rings[rings.length - 1].r; g.rc = g.rl + 76;
  });
  // cada grupo recebe uma fatia angular e fica à menor distância do gateway que cabe dentro da própria fatia
  const GAP = 40, TOP = 0.5, avail = 2 * Math.PI - TOP;
  groups.forEach(g => g.wt = Math.pow(2 * g.rc + GAP, 0.55));
  const tot = groups.reduce((s, g) => s + g.wt, 0) || 1;
  let a = -Math.PI / 2 + TOP / 2;
  const q = terms(), isHit = d => !q.length || q.every(t => d._h.includes(t));
  let edges = '', nodes = '', hubs = '';
  groups.forEach(g => {
    const w = g.wt / tot * avail, th = a + w / 2; a += w;
    const half = Math.min(w / 2, Math.PI / 2 - 0.05);
    const R = Math.max(g.rc + 140, (g.rc + GAP / 2) / Math.sin(half));
    const hx = Math.cos(th) * R, hy = Math.sin(th) * R, col = cvar(g.c.id);
    edges += `<path class="edge-g" d="M0,0 L${hx.toFixed(1)},${hy.toFixed(1)}" style="stroke:${col}"/>`;
    let idx = 0;
    g.rings.forEach((ring, ri) => {
      for (let i = 0; i < ring.n; i++, idx++) {
        const d = g.items[idx];
        const ang = th + Math.PI + (2 * Math.PI * i / ring.n) + (ri % 2 ? Math.PI / ring.n : 0);
        const x = hx + Math.cos(ang) * ring.r, y = hy + Math.sin(ang) * ring.r, hit = isHit(d);
        edges += `<line class="edge ${hit ? '' : 'dim'}" x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${col}"/>`;
        nodes += mapNode(d, x, y, hit);
      }
    });
    hubs += `<g transform="translate(${hx.toFixed(1)},${hy.toFixed(1)})" style="color:#fff">
      <rect x="-17" y="-17" width="34" height="34" rx="6" style="fill:${col}"/><use href="#i-${g.c.icone}" x="-11" y="-11" width="22" height="22"/>
      <text class="hub-lbl" y="${g.rl + 54}">${esc(g.c.nome)}</text><text class="hub-cnt" y="${g.rl + 69}">${g.items.length} dispositivo(s)</text></g>`;
  });
  const gwHit = gw ? isHit(gw) : true;
  const center = `<g transform="translate(0,-112)" style="color:var(--text-3)"><circle r="20" style="fill:var(--win);stroke:var(--border);stroke-width:1.5"/>
      <use href="#i-globe" x="-12" y="-12" width="24" height="24"/><text class="hub-cnt" y="36">Internet</text></g>
    <line x1="0" y1="-92" x2="0" y2="-32" style="stroke:var(--text-3);stroke-width:1.5;stroke-dasharray:4 4"/>
    <g class="node ${gwHit ? '' : 'dim'} ${gw && st.sel === gw.chave ? 'sel' : ''}" ${gw ? `data-k="${esc(gw.chave)}"` : ''} style="color:#fff">
      <rect x="-30" y="-30" width="60" height="60" rx="10" style="fill:var(--accent)"/><use href="#i-router" x="-17" y="-17" width="34" height="34"/>
      <text class="hub-lbl" y="48">${gw ? esc(gw.nome || 'Gateway') : 'Rede'}</text>
      <text class="hub-cnt" y="63">${gw ? esc(gw.ip) + ' · gateway' : esc(D.meta.rede)}</text>
      ${gw ? `<title>${esc(dname(gw))} — ${esc(gw.ip)}</title>` : ''}</g>`;
  vp.innerHTML = `<g>${edges}</g><g>${hubs}</g><g>${nodes}</g>${center}`;
  if (!st.view.fitted) fitMap(); else applyView();
}
function mapNode(d, x, y, hit) {
  const c = catById(d.cat);

function applyView() { const v = st.view; $('#vp').setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`); }

  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx: st.view.x, vy: st.view.y, moved: false, node: e.target.closest('.node') }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {

  });

}

  out.push(tile('MTU', m.caminho ? nf(m.caminho, 0) + ' bytes' : '—', m.caminho ? (m.pmtud_ok ? 'aviso de fragmentação funcionando' : 'sem aviso de fragmentação') : 'não medido', m.caminho ? (ids.has('R-13') ? 'warn' : 'ok') : ''));
  const r = R.rota || {}, h1 = (r.hops || []).find(h => h.ip);
  out.push(tile('Rota', r.saltos ? r.saltos + ' saltos' : '—', r.chegou ? `até ${esc(r.alvo)}${h1 ? ' · 1º salto ' + esc(h1.ip) : ''}` : r.hops ? 'não chegou em 15 saltos' : 'não medido', r.hops ? (r.chegou ? 'ok' : 'warn') : ''));
  return out.join('');
}

function hbars(W, rows, label, color) {

}
function chartG1(W) {

function chartG4(W) {

function chartG2(W) {
  const R = D.diagnostico, v = R.velocidade || {}, cfg = D.config || {};
  const rows = [['Download', v.download_mbps || [], cfg.plano_down_mbps], ['Upload', v.upload_mbps || [], cfg.plano_up_mbps]].filter(r => r[1].length);
  if (!rows.length) return '';
  const nar = W < 540;
  const M = Math.max(...rows.flatMap(r => r[1]), ...rows.map(r => r[2] || 0));
  const LW = 92, RW = nar ? 8 : 150, top = 24, rowH = nar ? 70 : 54, H = top + rows.length * rowH + 18;
  const x0 = LW, x1 = W - RW, x = val => x0 + (x1 - x0) * val / M;
  const tk = niceTicks(M, nar ? 3 : 5);
  let s = svgOpen(W, H, 'Velocidade livre medida comparada ao plano: ' + rows.map(([n, vals, p]) => `${n} mediana ${nf(median(vals))} Mbps${p ? ' de ' + p + ' contratados' : ''}`).join('; '));
  tk.forEach(t => s += `<line x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${top - 4}" y2="${H - 16}" class="ch-grid"/><text x="${x(t).toFixed(1)}" y="${H - 3}" text-anchor="middle" class="ch-ax">${nf(t, 1)}</text>`);
  rows.forEach(([nome, vals, plano], i) => {
    const yc = top + i * rowH + 20, m = median(vals), lo = Math.min(...vals), hi = Math.max(...vals);
    const pct = plano ? m / plano : null;
    const cor = pct == null ? 'var(--accent)' : pct >= .8 ? 'var(--ok)' : pct >= .6 ? 'var(--warn)' : 'var(--crit)';
    const rot = `${nf(lo)}–${nf(hi)} Mbps${pct != null ? ' · ' + Math.round(pct * 100) + '%' : ''}`;
    s += `<text x="0" y="${yc - 1}" class="ch-lbl">${nome}</text><text x="0" y="${yc + 14}" class="ch-ax">mediana ${nf(m)}</text>`;
    s += `<rect x="${x0}" y="${yc - 11}" width="${((plano ? x(plano) : x1) - x0).toFixed(1)}" height="22" rx="3" class="ch-track"/>`;
    s += `<rect x="${x0}" y="${yc - 7}" width="${Math.max(2, x(m) - x0).toFixed(1)}" height="14" rx="2" style="fill:${cor}"><title>${nome}: mediana ${nf(m)} Mbps${plano ? ` (${Math.round(pct * 100)}% do plano de ${nf(plano, 0)} Mbps)` : ''}</title></rect>`;
    s += `<g class="ch-whisk"><title>Rodadas: ${vals.map(z => nf(z)).join(', ')} Mbps</title><line x1="${x(lo).toFixed(1)}" x2="${x(hi).toFixed(1)}" y1="${yc}" y2="${yc}"/>
      <line x1="${x(lo).toFixed(1)}" x2="${x(lo).toFixed(1)}" y1="${yc - 5}" y2="${yc + 5}"/><line x1="${x(hi).toFixed(1)}" x2="${x(hi).toFixed(1)}" y1="${yc - 5}" y2="${yc + 5}"/></g>`;
    if (plano) s += `<line x1="${x(plano).toFixed(1)}" x2="${x(plano).toFixed(1)}" y1="${yc - 15}" y2="${yc + 15}" class="ch-plan"/><text x="${x(plano).toFixed(1)}" y="${yc - 19}" text-anchor="end" class="ch-ax">Plano ${nf(plano, 0)} Mbps</text>`;
    s += nar ? `<text x="${x1}" y="${yc + 30}" text-anchor="end" class="ch-val">${rot}</text>` : `<text x="${W}" y="${yc + 5}" text-anchor="end" class="ch-val">${rot}</text>`;
  });
  return s + '</svg>';
}
function chartG3(W) {
  const R = D.diagnostico, g = R.gateway;
  if (!g || !(g.amostras || []).length) return '';
  const inet = (R.internet || []).filter(x => x && (x.amostras || []).length);
  const okAll = [g, ...inet].flatMap(x => x.amostras.filter(v => v >= 0)).sort((a, b) => a - b);
  const p99 = okAll.length ? okAll[Math.min(okAll.length - 1, Math.floor(okAll.length * .99))] : 0;
  const yMax = Math.max(5, p99 * 1.2), tk = niceTicks(yMax, 4).filter(t => t <= yMax);
  const wide = W >= 620 && inet.length, mw = wide ? Math.round(W * .64) : W;
  const H = 170, ml = 42, mr = 6, mt = 10, mb = 22, n = g.amostras.length;
  const X = i => ml + (mw - ml - mr) * (n > 1 ? i / (n - 1) : 0), Y = v => mt + (H - mt - mb) * (1 - Math.min(v, yMax) / yMax);
  const series = (am, Xf, Yf, base) => {
    let line = '', area = '', seg = [];
    const flush = () => { if (seg.length) { const dd = seg.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      line += `<path d="${dd}" class="ch-line"/>`; area += `<path d="${dd} L${seg[seg.length - 1][0].toFixed(1)} ${base} L${seg[0][0].toFixed(1)} ${base} Z" class="ch-area"/>`; } seg = []; };
    am.forEach((v, i) => { if (v < 0) flush(); else seg.push([Xf(i), Yf(v)]); });
    flush();
    return area + line;
  };
  const sparkH = wide ? (H - 18) / 2 : 70, Htot = wide ? H : H + 14 + inet.length * (sparkH + 6);
  let s = svgOpen(W, Htot, `Latência até o roteador em ${n} amostras: média ${nf(g.media_ms, 2)} ms, máximo ${nf(g.max_ms)} ms, ${g.perdidos} perdidas.` + inet.map(x => ` ${x.alvo}: média ${nf(x.media_ms)} ms, ${x.perdidos} perdidas.`).join(''));
  tk.forEach(t => s += `<line x1="${ml}" x2="${mw - mr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" class="ch-grid"/><text x="${ml - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" class="ch-ax">${nf(t, 1)} ms</text>`);
  s += series(g.amostras, X, Y, Y(0).toFixed(1));
  g.amostras.forEach((v, i) => { if (v < 0) s += `<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${mt}" y2="${mt + 10}" class="ch-lost"><title>Amostra ${i + 1}: perdida</title></line>`; });
  [0, Math.floor((n - 1) / 2), n - 1].forEach(i => s += `<text x="${X(i).toFixed(1)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" class="ch-ax">${i + 1}</text>`);
  inet.forEach((x, k) => {
    const sx = wide ? mw + 22 : 0, sw = wide ? W - mw - 22 : W, sy = wide ? k * (sparkH + 18) : H + 14 + k * (sparkH + 6);
    const top = sy + 16, hh = sparkH - 18, m = x.amostras.length;
    const Xs = i => sx + sw * (m > 1 ? i / (m - 1) : 0), Ys = v => top + hh * (1 - Math.min(v, yMax) / yMax);
    s += `<text x="${sx}" y="${sy + 11}" class="ch-ax"><tspan class="ch-lbl2">${esc(x.alvo)}</tspan> · média ${nf(x.media_ms)} ms · ${x.perdidos} perdido${x.perdidos === 1 ? '' : 's'}</text>`;
    s += `<line x1="${sx}" x2="${sx + sw}" y1="${(top + hh).toFixed(1)}" y2="${(top + hh).toFixed(1)}" class="ch-grid"/>`;
    s += series(x.amostras, Xs, Ys, (top + hh).toFixed(1));
    x.amostras.forEach((v, i) => { if (v < 0) s += `<line x1="${Xs(i).toFixed(1)}" x2="${Xs(i).toFixed(1)}" y1="${top}" y2="${top + 7}" class="ch-lost"/>`; });
  });
  return s + `</svg><p class="ch-cap">${g.perdidos} perdido${g.perdidos === 1 ? '' : 's'} de ${n} · média ${nf(g.media_ms, 2)} ms · máx ${nf(g.max_ms)} ms${inet.length ? ` · internet na mesma escala, ${wide ? 'à direita' : 'abaixo'}` : ''}</p>`;
}

function updateDiagUI(force) {

    + (d.modelo ? ro('Modelo', d.modelo) : '') + (d.firmware ? ro('Firmware', d.firmware) : '') + (d.so ? ro('Sistema', d.so) : '') + ro('Nome na rede', d.nome_rede);
  const svcRows = svcs.map(s => `<tr><td class="mono num">${s.port}</td><td title="${esc(s.nome)}">${esc(s.nome)}</td><td>${esc(s.tipo)}</td><td class="muted" title="${esc(s.det)}" style="max-width:200px">${esc(s.det || '')}</td>
      <td style="width:52px">${s.rdp ? `<button class="ib" data-rdp="${esc(s.rdp)}" title="Abrir RDP" type="button">${ic('monitor')}</button>` : s.url ? `<a class="ib" href="${esc(s.url)}" target="_blank" rel="noopener" title="Abrir ${esc(s.url)}">${ic('external')}</a>` : ''}<button class="ib" data-copy="${esc(s.copy)}" title="Copiar ${esc(s.copy)}" type="button">${ic('copy')}</button></td></tr>`).join('');
  const ident = `<table class="t kv"><tbody><tr><td>Categoria</td><td><span class="dot" style="--c:${cvar(d.cat)}"></span>${esc(c.nome)}${d.manual ? ' (definida por você)' : ''}</td></tr>
      <tr><td>Classificação automática</td><td>${esc(ca.nome)} · <span class="conf ${d.confianca}"><i></i>confiança ${d.confianca}</span></td></tr></tbody></table>
      <p style="margin:12px 0 6px;font-weight:600">Por que essa categoria</p><ul class="evid">${d.evidencias.map(x => `<li>${ic('chevronR')}<span>${esc(x)}</span></li>`).join('')}</ul>`;
  const hist = ro('Primeira vez', fmtDate(d.primeiro)) + ro('Última vez', fmtDate(d.ultimo)) + ro('IPs usados', (d.ips || []).join(', ') || d.ip, 1) + ro('Responde ping', d.ping ? 'sim' : 'não');
  const web = webLinks(d)[0], rdp = d.svcs.find(s => s.rdp);
  const panes = [['geral', 'Geral', geral],
    ['servicos', `Serviços (${d.svcs.length})`, svcRows ? `<div style="margin:-12px -10px -6px;overflow:auto"><table class="t"><thead><tr><th class="num">Porta</th><th>Serviço</th><th>Tipo</th><th>Detalhes</th><th></th></tr></thead><tbody>${svcRows}</tbody></table></div>` : '<p class="muted">Nenhuma porta TCP aberta encontrada.</p>'],
    ['ident', 'Identificação', ident], ['hist', 'Histórico', hist]];
  const dlg = dialog(`<div class="wd">${dlgHead(c.icone, `Dispositivo &lt;${esc(d.ip)}&gt;`)}
    <div class="wd-body"><div class="wd-main">
      <nav class="win-tabs">${panes.map(([id, l]) => `<button class="tab ${id === paneInicial ? 'on' : ''}" data-pane="${id}" type="button">${l}</button>`).join('')}</nav>
      ${panes.map(([id, , h]) => `<div class="pane" data-pane="${id}" ${id === paneInicial ? '' : 'hidden'}>${h}</div>`).join('')}
    </div>
    <div class="wd-btns">
      ${STATIC ? `<button class="b pri" data-close type="button">Fechar</button>` : `<button class="b pri" id="e-ok" type="button">${ic('check')}OK</button><button class="b" data-close type="button">Cancelar</button><button class="b" id="e-apl" type="button">Aplicar</button>`}
      <hr>
      ${web ? `<a class="b" href="${esc(web.url)}" target="_blank" rel="noopener">${ic('external')}Abrir web</a>` : ''}
      ${rdp ? `<button class="b" data-rdp="${esc(rdp.rdp)}" type="button">${ic('monitor')}Abrir RDP</button>` : ''}
      <button class="b" data-copy="${esc(d.ip)}" type="button">${ic('copy')}Copiar IP</button>
      ${d.mac ? `<button class="b" data-copy="${esc(d.mac)}" type="button">${ic('copy')}Copiar MAC</button>` : ''}
    </div></div>
    <footer class="wd-st"><span class="dot" style="--c:${d.online ? 'var(--ok)' : 'var(--text-3)'}"></span>${d.online ? 'online' : 'não visto nesta varredura (' + esc(ago(d.ultimo)) + ')'}
      ${d.novo ? '<span class="tag new">NOVO</span>' : ''}${d.tag ? `<span class="tag">${esc(d.tag)}</span>` : ''}<span class="grow"></span><span class="muted">${esc(d.fabricante || '')}</span></footer></div>`);
  dlg.onclose = () => { if (st.page === 'mapa') $$('#map .node.sel').forEach(n => n.classList.remove('sel')); };
  const salvar = async fechar => {
    try {
      await api('/api/dispositivo', { chave: d.chave, nome: $('#e-nome').value, categoria: $('#e-cat').value, notas: $('#e-notas').value });
      snack('Dispositivo salvo'); await loadData();
      if (fechar) { dlg.close(); render(); } else { render(); openItem(d.chave, 'geral'); }
    } catch (e) { snack('Erro ao salvar: ' + e.message); }
  };
  if (!STATIC) { $('#e-ok').onclick = () => salvar(true); $('#e-apl').onclick = () => salvar(false); }
}

// ---------------------------------------------------------------- dados / polling
async function loadData() {
  if (STATIC) return;
  try { D = await api('/api/dados'); indexData(); } catch (e) { snack('Falha ao carregar dados: ' + e.message); }
}
let pollT = null, lastDataPull = 0, wasRunning = false, wasDiag = false;
function pollSoon() { clearTimeout(pollT); pollT = setTimeout(poll, 300); }
async function poll() {
  clearTimeout(pollT);
  try {
    ESTADO = await api('/api/estado');
    updateScanUI();
    const now = Date.now(), dgRun = !!(ESTADO.diag && ESTADO.diag.rodando);
    if (ESTADO.rodando && now - lastDataPull > 5000 && !['varredura', 'diagnostico'].includes(st.page) && !$('#dlg').open) {
      lastDataPull = now; await loadData(); render();
    }
    if (wasRunning && !ESTADO.rodando) {
      await loadData(); st.view.fitted = false; if (!$('#dlg').open) render();
      if (!dgRun) setStatus(ESTADO.fase === 'erro' ? 'A varredura falhou: ' + ESTADO.erro : 'Varredura concluída', ESTADO.fase === 'erro' ? 'erro' : 'info', 10000);
    }
    if (wasDiag && !dgRun) {
      await loadData(); if (!$('#dlg').open) render();
      const f = ESTADO.diag.fase;
      setStatus(f === 'erro' ? 'O diagnóstico falhou: ' + ESTADO.diag.erro : f === 'cancelado' ? 'Diagnóstico interrompido' : 'Diagnóstico concluído', f === 'erro' ? 'erro' : 'info', 10000);
    }
    if (!wasRunning && ESTADO.rodando && st.page === 'varredura') render();
    wasRunning = ESTADO.rodando; wasDiag = dgRun;
    updateSub();
  } catch (e) { }
  pollT = setTimeout(poll, ESTADO && (ESTADO.rodando || (ESTADO.diag && ESTADO.diag.rodando) || (ESTADO.oui && ESTADO.oui.rodando)) ? 1000 : 5000);
}
function setQ(v) { st.q = v; $('#q').value = v; }

// ---------------------------------------------------------------- eventos globais
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { e.preventDefault(); copy(c.dataset.copy); return; }
  const r = e.target.closest('[data-rdp]'); if (r) { e.preventDefault(); downloadRdp(r.dataset.rdp); return; }
  if (!DESK()) return;
  const a = e.target.closest('a[href]');
  if (!a) return;
  if (a.id === 'btn-export') { e.preventDefault(); exportDesk(); return; }
  const href = a.getAttribute('href');
  if (/^(https?|rtsp|ftp|ssh|telnet|vnc|file):/i.test(href)) {
    e.preventDefault();
    window.pywebview.api.abrir(href).then(ok => { if (ok !== true) { snack('Não há programa para abrir ' + href.split(':')[0].toUpperCase() + ': endereço copiado'); copy(href); } });
  }
});
async function exportDesk() {
  snack('Escolha onde salvar o arquivo…');
  const r = await window.pywebview.api.exportar();
  if (r && r.arquivo) { snack('Salvo em ' + r.arquivo); window.pywebview.api.abrir_arquivo(r.arquivo); }
  else if (r && r.erro) snack(r.erro);
}
async function encerrar() {
  if (!confirm('Encerrar o Scanner de Rede?' + (ESTADO && ESTADO.rodando ? ' A varredura em andamento será interrompida.' : ''))) return;
  try { await api('/api/encerrar', {}); } catch (e) {}
  document.body.innerHTML = '<div class="empty" style="padding-top:20vh"><h3>Scanner de Rede encerrado</h3><p>Você já pode fechar esta aba.</p></div>';
}
$$('.mi').forEach(b => b.onclick = () => go(b.dataset.p));
$('#q').addEventListener('input', e => { st.q = e.target.value; render(); });
$('#scrim').onclick = () => document.body.classList.remove('menu-open');
$('#btn-menu').onclick = () => document.body.classList.toggle('menu-open');
$('#btn-quit').onclick = encerrar;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.body.classList.remove('menu-open'); if (document.activeElement === $('#q') && st.q) { setQ(''); render(); } }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'f') && !$('#dlg').open) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if (e.key === 'Enter' && st.sel && !$('#dlg').open && ['dispositivos', 'servicos'].includes(st.page) && !/INPUT|TEXTAREA|SELECT|BUTTON|^A$/.test(document.activeElement.tagName)) openItem(st.sel);
});
$('#btn-refresh').onclick = async () => { await loadData(); render(); snack('Dados atualizados'); };
$('#btn-theme').onclick = () => {
  const r = document.documentElement, t = r.dataset.theme === 'dark' ? 'light' : 'dark';
  r.dataset.theme = t; themeIcon();
  try { localStorage.setItem('scanner-tema', t); } catch (e) {}
  if (st.page === 'mapa') renderMapa();
  if (st.page === 'diagnostico') drawCharts();
};
window.addEventListener('pywebviewready', () => { if (st.page === 'varredura') render(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (PAGES[h] && h !== st.page) go(h); });
// gráficos são desenhados na largura real do contêiner: redesenha ao redimensionar e ao imprimir
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (st.page === 'diagnostico' && D) drawCharts(); }, 150); });
window.addEventListener('beforeprint', () => { if (st.page === 'diagnostico' && D) drawCharts(); });
window.addEventListener('afterprint', () => { if (st.page === 'diagnostico' && D) drawCharts(); });

// ---------------------------------------------------------------- início
(async function init() {
  try { const t = localStorage.getItem('scanner-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  chrome();
  $('#stb-ico').innerHTML = ic('checkCircle');
  if (STATIC) { $$('.app-only').forEach(x => x.hidden = true); indexData(); }
  else { await loadData(); }
  const h = (location.hash || '').slice(1);
  go(PAGES[h] ? h : (D && PAGES[D.pagina] ? D.pagina : 'painel'));
  if (!STATIC) poll();
})();
</script>
</body>
</html>
